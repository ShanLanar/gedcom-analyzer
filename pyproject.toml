[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedcom-analyzer"
version = "0.1.0"
description = "Genealogie-Suite: GEDCOM-Analyse, DNA-Match-Auswertung (Ancestry/MyHeritage/GEDmatch), Kirchenbuch-Erschließung (Matricula) und Entity-Resolution"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
viewer   = ["flask>=3.0"]
scraping = ["playwright>=1.40"]
vision   = ["anthropic>=0.40"]
ml       = ["scikit-learn>=1.0"]
dev      = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.8"]
all      = ["gedcom-analyzer[viewer,scraping,vision,ml,dev]"]

[tool.setuptools]
# Hinweis: 'tasks' und 'lib' sind generische Top-Level-Namen — nur editable
# in eine projekteigene virtuelle Umgebung installieren, nie systemweit.
packages = [
    "ancestry",
    "ancestry.core",
    "ancestry.core.db",
    "ancestry.core.db.repos",
    "ancestry.gui",
    "ancestry.gui.tabs",
    "ancestry.gui.widgets",
    "ancestry.models",
    "ancestry.tools",
    "ancestry.utils",
    "tasks",
    "lib",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # Bestehender Legacy-Stil (schrittweise bereinigt, kein CI-Gate)
    "E501",   # line-too-long (app.py hat ~300 Zeilen > 100)
    "E701",   # multiple-statements-on-one-line-colon
    "E702",   # multiple-statements-on-one-line-semicolon
    "E402",   # module-import-not-at-top-of-file (lazy imports bewusst eingesetzt)
    "F401",   # unused-import (viele Re-Exports und lazy-Import-Pattern)
    "F841",   # local variable assigned but never used
    "E741",   # ambiguous-variable-name (l, O, I – in Genealogiedaten üblich)
    "E731",   # lambda-assignment
    "E722",   # bare-except (bewusst in Scraper-Fallbacks)
    "F811",   # redefined-while-unused (lazy inner imports in GUI-Methoden)
]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen assert-Rewrite-Pattern und mehr Freiheiten nutzen
"tests/*" = ["F811", "E401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: Tests die tkinter/Display benötigen (unter CI mit xvfb oder skip)"]

[tool.coverage.run]
source = ["ancestry"]
branch = true
omit = [
    # GUI-Tkinter-Code wird (noch) nur per Smoke-Tests gestreift, nicht voll abgedeckt
    "ancestry/gui/app.py",
    "ancestry/tools/*",
    "*/__main__.py",
]

[tool.coverage.report]
# Ziel: >80 % auf der getesteten Kernlogik. Noch kein hartes CI-Gate (fail_under),
# damit der Aufbau der Suite die Pipeline nicht blockiert.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
]

[tool.mypy]
# Schrittweise Typprüfung: zunächst gut getypte, abhängigkeitsarme Kernmodule.
# Weitere Module aufnehmen, sobald sie sauber durchlaufen.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = [
    "ancestry/core/endogamy_dna.py",
    "ancestry/core/pedigree_gaps.py",
    "ancestry/core/mrca_map.py",
    "ancestry/core/gedmatch_export.py",
    "ancestry/core/triangulation_report.py",
    "ancestry/core/cluster.py",
    "ancestry/core/mta_import.py",
]
