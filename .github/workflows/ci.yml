name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-randomly curl_cffi
          pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        # Kein tail-Pipe (verschluckt den Exit-Code) und kein continue-on-error
        # mehr: rote Tests MÜSSEN den Job rot machen, sonst ist das Gate wirkungslos.
        # --cov nutzt automatisch [tool.coverage.*] aus pyproject.toml (source,
        # omit, exclude_lines). BEWUSST kein --cov-fail-under: die Suite ist
        # noch im Aufbau, das soll sie nicht rot machen (siehe Kommentar dort) —
        # das hier macht die Zahl nur wieder SICHTBAR (vorher installierte CI
        # pytest-cov gar nicht, obwohl [tool.coverage.*] es voraussetzt).
        # pytest-randomly ist installiert → die Testreihenfolge ist ab jetzt
        # PRO LAUF zufällig (genau das hätte den in database.py behobenen
        # Waisenzeilen-Race früher sichtbar gemacht). Bei einem roten Lauf
        # druckt pytest-randomly den Seed ("Using --randomly-seed=…") — damit
        # lokal reproduzieren: `pytest -p randomly --randomly-seed=<seed>`,
        # bevor man den Fehler als reinen Reihenfolge-Zufall abtut.
        run: >
          python -m pytest -q --tb=short
          --cov=ancestry --cov-report=term-missing
