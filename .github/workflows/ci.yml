name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest curl_cffi
          pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        # Kein tail-Pipe (verschluckt den Exit-Code) und kein continue-on-error
        # mehr: rote Tests MÜSSEN den Job rot machen, sonst ist das Gate wirkungslos.
        run: python -m pytest -q --tb=short
